<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Todo</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }
    li.done { text-decoration: line-through; color: #888; }
    #error { color: #c00; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="todo-form">
    <input id="title-input" type="text" placeholder="要做什麼？" autocomplete="off">
    <button id="add-button" type="submit">新增</button>
  </form>
  <p id="error"></p>
  <ul id="todo-list"></ul>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("title-input");
    const list = document.getElementById("todo-list");
    const error = document.getElementById("error");

    function render(todo) {
      const item = document.createElement("li");
      item.dataset.id = todo.id;
      item.textContent = todo.title;
      if (todo.done) item.classList.add("done");
      list.appendChild(item);
    }

    async function loadTodos() {
      const res = await fetch("/api/todos");
      (await res.json()).forEach(render);
    }

    async function addTodo(title) {
      const res = await fetch("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) {
        const detail = (await res.json()).detail;
        error.textContent = typeof detail === "string" ? detail : "新增失敗";
        return;
      }
      error.textContent = "";
      render(await res.json());
      input.value = "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTodo(input.value);
    });

    loadTodos();
  </script>
</body>
</html>
